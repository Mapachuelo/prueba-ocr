apiVersion: v1
kind: Pod
metadata:
  name: ocr-app
  labels:
    app: ocr-pdf
spec:
  containers:
    - name: backend
      image: localhost/ocr-backend:latest
      ports:
        - containerPort: 8000
      volumeMounts:
        - name: data
          mountPath: /app/data
      resources:
        limits:
          memory: "2Gi"
          cpu: "2"

    - name: frontend
      image: localhost/ocr-frontend:latest
      ports:
        - containerPort: 80
          hostPort: 8080
      resources:
        limits:
          memory: "128Mi"
          cpu: "0.5"

  volumes:
    - name: data
      hostPath:
        path: ./data
        type: DirectoryOrCreate
