<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR PDF a Excel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginView" class="login-screen" hidden>
        <section class="login-brand">
            <div class="brand-line">
                <span class="brand-mark">OCR</span>
                <span class="brand-name">PDF a Excel</span>
            </div>
            <h1>Extrae datos, revisa con filtros y compara resultados.</h1>
            <p class="muted-light">OCR local con Tesseract o modelos de visión en llama.cpp. Exporta a Excel, CSV o PDF.</p>
            <ul class="benefits" id="loginBenefits"></ul>
        </section>
        <section class="login-panel">
            <form id="loginForm" class="login-card">
                <h2 id="loginTitle">Iniciar sesión</h2>
                <p id="loginHint" class="muted"></p>
                <label class="field">Usuario<input id="loginUser" autocomplete="username" required></label>
                <label class="field">Contraseña<input id="loginPass" type="password" autocomplete="current-password" required></label>
                <label class="field" id="loginConfirmWrap" hidden>Confirmar contraseña<input id="loginConfirm" type="password" autocomplete="new-password"></label>
                <label class="checkbox" id="rememberWrap"><input type="checkbox" id="loginRemember" checked> Recordar sesión</label>
                <button type="submit" class="btn primary block" id="loginSubmit">Entrar</button>
                <div id="loginError" class="alert error" hidden></div>
                <p class="login-foot muted">¿Olvidaste la contraseña? Pide al administrador que la restablezca.</p>
            </form>
        </section>
    </div>

    <div id="appView" class="app" hidden>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <span class="brand-mark small">OCR</span>
                <span>PDF a Excel</span>
            </div>
            <nav class="nav" id="mainNav"></nav>
            <div class="sidebar-foot">
                <div class="user-chip">
                    <span class="avatar" id="userAvatar">U</span>
                    <span>
                        <strong id="userName"></strong>
                        <small id="userRole"></small>
                    </span>
                </div>
                <button class="btn ghost sm block" id="btnPassword">Cambiar contraseña</button>
                <button class="btn ghost sm block" id="btnLogout">Cerrar sesión</button>
            </div>
        </aside>
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <div class="app-main">
            <header class="topbar">
                <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menú"></button>
                <div>
                    <h1 id="pageTitle">Inicio</h1>
                    <p class="muted" id="pageSubtitle"></p>
                </div>
                <div class="topbar-actions">
                    <span class="badge-soft" id="topUser"></span>
                </div>
            </header>
            <main class="content" id="content"></main>
        </div>
    </div>

    <div class="toasts" id="toasts"></div>
    <div id="modalRoot"></div>
    <script type="module" src="app.js"></script>
</body>
</html>
